<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-G Compiler</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Primary Local Stylesheet -->
    <link rel="stylesheet" href="/style.css">

    <!-- Theme: apply before paint to prevent flash -->
    <script>
        (function() {
            try {
                var t = localStorage.getItem('zerog_theme');
                document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
            } catch(e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>

<body class="bg-app text-primary overflow-hidden">
    <!-- React Root Mount -->
    <div id="root">
        <!-- Initial skeleton while React mounts -->
        <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-app,#0a0a0c);color:#94a3b8;font-family:monospace;">
            <div style="font-size:24px;font-weight:bold;color:var(--accent-purple-light,#c084fc);margin-bottom:8px;">ZERO-G</div>
            <div style="font-size:12px;color:#64748b;">Loading...</div>
        </div>
    </div>

    <!-- React Application Bundle -->
    <script src="/app.js"></script>
</body>

</html>
